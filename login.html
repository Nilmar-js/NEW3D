<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — New 3D</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<div id="a11y-root"></div>
<header class="site-header" id="header"></header>

<section class="auth-section blueprint-bg">
  <div class="auth-box">
    <div class="hero-eyebrow-line"></div>
    <h1>Entrar na sua conta</h1>
    <p class="sub">Acesse pra acompanhar seus pedidos e finalizar compras.</p>

    <div class="form-msg" id="formMsg"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <p class="auth-switch">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
  </div>
</section>

<footer class="site-footer" id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/accessibility.js"></script>
<script src="js/main.js"></script>
<script>
  initPage(null);

  // Se já estiver logado, manda direto pra conta
  if (getCurrentUser()) location.href = "conta.html";

  const redirectAfter = new URLSearchParams(location.search).get("redirect") || "conta.html";

  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const result = loginUser({ email, senha });
    const msg = document.getElementById("formMsg");
    if (result.ok) {
      msg.className = "form-msg success show";
      msg.textContent = "Login realizado! Redirecionando...";
      setTimeout(() => (location.href = redirectAfter), 500);
    } else {
      msg.className = "form-msg error show";
      msg.textContent = result.msg;
    }
  });
</script>
</body>
</html>
