<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — New 3D</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<div id="a11y-root"></div>
<header class="site-header" id="header"></header>

<section class="auth-section blueprint-bg">
  <div class="auth-box">
    <div class="hero-eyebrow-line"></div>
    <h1>Criar conta</h1>
    <p class="sub">Cadastre-se pra comprar e acompanhar seus pedidos.</p>

    <div class="form-msg" id="formMsg"></div>

    <form id="cadastroForm" novalidate>
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required minlength="4" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
    </form>

    <p class="auth-switch">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>
</section>

<footer class="site-footer" id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/accessibility.js"></script>
<script src="js/main.js"></script>
<script>
  initPage(null);

  if (getCurrentUser()) location.href = "conta.html";

  document.getElementById("cadastroForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const msg = document.getElementById("formMsg");

    if (senha.length < 4) {
      msg.className = "form-msg error show";
      msg.textContent = "A senha precisa ter pelo menos 4 caracteres.";
      return;
    }

    const result = registerUser({ nome, email, senha });
    if (result.ok) {
      loginUser({ email, senha });
      msg.className = "form-msg success show";
      msg.textContent = "Conta criada! Redirecionando...";
      setTimeout(() => (location.href = "conta.html"), 500);
    } else {
      msg.className = "form-msg error show";
      msg.textContent = result.msg;
    }
  });
</script>
</body>
</html>
