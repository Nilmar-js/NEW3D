<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho — New 3D</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<div id="a11y-root"></div>
<header class="site-header" id="header"></header>

<section class="cart-section container">
  <h2 style="margin-bottom: 28px;">Seu carrinho</h2>
  <div id="cartRoot"></div>
</section>

<footer class="site-footer" id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/accessibility.js"></script>
<script src="js/main.js"></script>
<script src="js/payment.js"></script>
<script>
  function renderCart() {
    const items = getCartWithDetails();
    const root = document.getElementById("cartRoot");

    if (items.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2.5 3h2l2.6 12.6a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"/></svg>
          <h3>Seu carrinho está vazio</h3>
          <p>Que tal dar uma olhada no catálogo?</p>
          <a href="index.html" class="btn btn-primary" style="margin-top:18px;">Ver produtos</a>
        </div>`;
      return;
    }

    const total = getCartTotal();

    root.innerHTML = `
      <div class="cart-layout">
        <div class="cart-list">
          ${items
            .map(
              (i) => `
            <div class="cart-item">
              <div class="thumb-sm">${productIconSVG(i.produto.icone)}</div>
              <div>
                <div class="name">${i.produto.nome}</div>
                ${i.personalizacao ? `<div class="meta">Personalização: "${i.personalizacao}"</div>` : ""}
                <div class="meta">${formatBRL(i.produto.preco)} · qtd
                  <button class="remove-link" data-action="minus" data-index="${i.index}" style="text-decoration:none; margin-left:6px;">−</button>
                  ${i.qtd}
                  <button class="remove-link" data-action="plus" data-index="${i.index}" style="text-decoration:none;">+</button>
                </div>
                <button class="remove-link" data-action="remove" data-index="${i.index}">Remover</button>
              </div>
              <div class="line-price">${formatBRL(i.subtotal)}</div>
            </div>`
            )
            .join("")}
        </div>
        <div class="summary-box">
          <div class="summary-row"><span>Subtotal</span><span>${formatBRL(total)}</span></div>
          <div class="summary-row"><span>Frete</span><span>Grátis</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatBRL(total)}</span></div>
          <button class="btn btn-primary btn-block" id="checkoutBtn" style="margin-top:16px;">Finalizar compra</button>
        </div>
      </div>
    `;

    root.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const index = Number(btn.dataset.index);
        const action = btn.dataset.action;
        const cart = getCart();
        if (action === "remove") removeFromCart(index);
        if (action === "plus") updateCartQty(index, cart[index].qtd + 1);
        if (action === "minus") updateCartQty(index, cart[index].qtd - 1);
        renderCart();
        renderHeader("catalogo");
      });
    });

    document.getElementById("checkoutBtn").addEventListener("click", () => {
      const user = getCurrentUser();
      if (!user) {
        showToast("Entre na sua conta pra finalizar a compra");
        setTimeout(() => (location.href = "login.html?redirect=carrinho.html"), 700);
        return;
      }
      const total = getCartTotal();
      openPaymentModal({
        total,
        onConfirm: (pagamento) => {
          const order = {
            data: new Date().toISOString(),
            itens: getCartWithDetails().map((i) => ({ nome: i.produto.nome, qtd: i.qtd, preco: i.produto.preco, personalizacao: i.personalizacao })),
            total,
            pagamento,
          };
          saveOrder(user.email, order);
          clearCart();
          renderHeader("catalogo");
          showToast("Pagamento confirmado! Abrindo WhatsApp pra combinar a entrega...");
          openWhatsappOrder(order, user);
          setTimeout(() => (location.href = "conta.html"), 1200);
        },
      });
    });
  }

  initPage("catalogo");
  renderCart();
</script>
</body>
</html>
